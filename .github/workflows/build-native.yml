name: Build native plugins

on:
  push:
    branches-ignore: [upm]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S 'Native~' -B build/windows -A x64
          -DTINYEXR_UNITY_BUILD_TESTS=ON
          -DTINYEXR_UNITY_OUTPUT_DIRECTORY="$env:GITHUB_WORKSPACE/staging/windows"
      - name: Build
        run: cmake --build build/windows --config Release --parallel
      - name: Test
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-windows-x86_64
          path: staging/windows/TinyExr.dll
          if-no-files-found: error

  linux:
    name: Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S 'Native~' -B build/linux
          -DCMAKE_BUILD_TYPE=Release
          -DTINYEXR_UNITY_BUILD_TESTS=ON
          -DTINYEXR_UNITY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/staging/linux"
      - name: Build
        run: cmake --build build/linux --parallel
      - name: Test
        run: ctest --test-dir build/linux --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-linux-x86_64
          path: staging/linux/libTinyExr.so
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S 'Native~' -B build/macos
          -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'
          -DTINYEXR_UNITY_BUILD_TESTS=ON
          -DTINYEXR_UNITY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/staging/macos"
      - name: Build
        run: cmake --build build/macos --parallel
      - name: Test
        run: ctest --test-dir build/macos --output-on-failure
      - name: Verify architectures
        run: lipo -archs staging/macos/libTinyExr.dylib
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-macos-universal
          path: staging/macos/libTinyExr.dylib
          if-no-files-found: error

  android:
    name: Android ARM64
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
      - name: Install NDK
        run: sdkmanager "ndk;$NDK_VERSION"
      - name: Configure
        run: >-
          cmake -S 'Native~' -B build/android
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DTINYEXR_UNITY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/staging/android"
      - name: Build
        run: cmake --build build/android --parallel
      - name: Strip
        run: >-
          "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          --strip-unneeded staging/android/libTinyExr.so
      - name: Verify Android 16 KB alignment
        shell: python
        run: |
          import pathlib
          import struct

          data = pathlib.Path("staging/android/libTinyExr.so").read_bytes()
          assert data[:6] == b"\x7fELF\x02\x01", "Expected a little-endian ELF64 library"
          offset = struct.unpack_from("<Q", data, 32)[0]
          size, count = struct.unpack_from("<HH", data, 54)
          segments = [struct.unpack_from("<IIQQQQQQ", data, offset + i * size)
                      for i in range(count)]
          loads = [s for s in segments if s[0] == 1]
          assert loads, "No ELF LOAD segments"
          for segment in loads:
              assert segment[7] >= 16384, f"LOAD alignment is {segment[7]}"
              assert (segment[3] - segment[2]) % 16384 == 0, "LOAD offsets are not congruent"
          for segment in segments:
              if segment[0] == 0x6474e552:
                  assert (segment[3] + segment[6]) % 16384 == 0, "RELRO end is not 16 KB aligned"
          print("Android LOAD and RELRO segments support 16 KB pages")
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-android-arm64
          path: staging/android/libTinyExr.so
          if-no-files-found: error

  ios:
    name: iOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S 'Native~' -B build/ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO
          -DTINYEXR_UNITY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/staging/ios"
      - name: Build
        run: cmake --build build/ios --config Release --parallel
      - name: Verify architecture
        run: lipo -archs staging/ios/libTinyExr.a
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-ios-arm64
          path: staging/ios/libTinyExr.a
          if-no-files-found: error

  upm-package:
    name: Assemble UPM package
    runs-on: ubuntu-latest
    needs: [windows, linux, macos, android, ios]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plugin-windows-x86_64
          path: Runtime/Plugins/Windows/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: plugin-linux-x86_64
          path: Runtime/Plugins/Linux/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: plugin-macos-universal
          path: Runtime/Plugins/macOS
      - uses: actions/download-artifact@v8
        with:
          name: plugin-android-arm64
          path: Runtime/Plugins/Android/arm64-v8a
      - uses: actions/download-artifact@v8
        with:
          name: plugin-ios-arm64
          path: Runtime/Plugins/iOS
      - name: Validate package metadata
        run: npm pkg get name version
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: unitytinyexr-upm
          path: '*.tgz'
          if-no-files-found: error


  publish-upm:
    name: Publish UPM branch
    needs: upm-package
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cross-platform-upm')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-upm
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unitytinyexr-upm
          path: artifact
      - name: Publish CI-built package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifact/*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one UPM tarball" >&2
            exit 1
          fi
          mkdir package
          tar -xzf "${packages[0]}" -C package --strip-components=1
          cd package
          git init --initial-branch=upm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          # Keep credentials out of the remote URL and committed package.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git ls-remote --heads origin > "$RUNNER_TEMP/upm-heads"
          if grep -q $'\trefs/heads/upm$' "$RUNNER_TEMP/upm-heads"; then
            git fetch --depth=1 origin upm
            git reset --mixed --quiet FETCH_HEAD
          fi
          git add --all
          if git diff --cached --quiet; then
            echo "UPM package is unchanged"
            exit 0
          fi
          git commit -m "Publish UPM package from ${SOURCE_SHA}"
          git push origin HEAD:refs/heads/upm
